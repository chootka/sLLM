# sllm.visceral.systems
#
# NOTE ON THE ARCHITECTURE, because it is not what it looks like:
# the public DNS name does NOT point at this Pi. It points at a reverse proxy
# (77.42.69.156) which terminates TLS and forwards plain HTTP/1.0 to this box
# over Tailscale, arriving from 100.75.40.22. So port 80 here IS the production
# path and must not be redirected to HTTPS -- doing that produces an infinite
# redirect loop for every public visitor.
#
# That upstream proxy sends no X-Forwarded-Proto and no X-Forwarded-For, so this
# box cannot otherwise distinguish a request that arrived over public HTTPS from
# a plaintext request on the studio LAN. The admin routes must be able to tell:
# a WebAuthn session token has to travel over TLS.
#
# Hence the map below. The proxy's Tailscale address is the trust anchor -- only
# a node on the tailnet can present it, and Tailscale authenticates that. The
# hop itself is WireGuard-encrypted, so "http" on the wire is not plaintext on
# the network.
#
# If the proxy is ever changed to send X-Forwarded-Proto itself, prefer that and
# delete this.
geo $from_tls_proxy {
    default 0;
    100.75.40.22/32 1;
}

map $from_tls_proxy $client_scheme {
    0 $scheme;
    1 https;
}

# HTTP server block
server {
    listen 80;
    listen [::]:80;
    server_name sllm.visceral.systems;
    absolute_redirect off;

    # Root directory for static files
    root /var/www/sllm/frontend;
    index index.html;

    # Logging
    access_log /var/log/nginx/sllm.access.log;
    error_log /var/log/nginx/sllm.error.log;

    # Serve static frontend files

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Captured images are immutable -- the filename carries the capture time and
    # the bytes are written once -- so the backend serves them `immutable` with a
    # long max-age and nothing is added here. These used to carry no-store, which
    # forbids the browser from keeping them at all: timelapse playback then
    # re-downloaded ~145KB per frame five times a second, each request cancelling
    # the last, and the picture never advanced past the first frame. A newly
    # captured frame is fetched with a cache-busting query string by the
    # frontend, which is where freshness actually needs handling.
    location /api/images/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # Proxy API requests to Flask backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy Socket.IO requests
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# HTTPS server block on port 443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sllm.visceral.systems;
    absolute_redirect off;

    # SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/sllm.visceral.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sllm.visceral.systems/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory for static files
    root /var/www/sllm/frontend;
    index index.html;

    # Logging
    access_log /var/log/nginx/sllm.access.log;
    error_log /var/log/nginx/sllm.error.log;

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Captured images are immutable -- the filename carries the capture time and
    # the bytes are written once -- so the backend serves them `immutable` with a
    # long max-age and nothing is added here. These used to carry no-store, which
    # forbids the browser from keeping them at all: timelapse playback then
    # re-downloaded ~145KB per frame five times a second, each request cancelling
    # the last, and the picture never advanced past the first frame. A newly
    # captured frame is fetched with a cache-busting query string by the
    # frontend, which is where freshness actually needs handling.
    location /api/images/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # Proxy API requests to Flask backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy Socket.IO requests
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
