# Nginx configuration for sllm.visceral.systems on Raspberry Pi 5
# HTTP-only version (SSL handled by Tailscale Funnel)

server {
    listen 80;
    listen [::]:80;
    server_name sllm.visceral.systems;

    # Emit relative Location headers. Requests arrive from the reverse proxy over
    # plain HTTP, so $scheme is "http" here and absolute redirects would downgrade
    # an HTTPS client to http:// - which browsers block as mixed content.
    absolute_redirect off;

    # Root directory for static files
    root /var/www/sllm/frontend;
    index index.html;

    # Logging
    access_log /var/log/nginx/sllm.access.log;
    error_log /var/log/nginx/sllm.error.log;

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Captured images are immutable -- the filename carries the capture time and
    # the bytes are written once -- so the backend serves them `immutable` with a
    # long max-age and nothing is added here. These used to carry no-store, which
    # forbids the browser from keeping them at all: timelapse playback then
    # re-downloaded ~145KB per frame five times a second, each request cancelling
    # the last, and the picture never advanced past the first frame. A newly
    # captured frame is fetched with a cache-busting query string by the
    # frontend, which is where freshness actually needs handling.
    location /api/images/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Aggressive cache-busting headers
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # Proxy API requests to Flask backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy Socket.IO requests
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
