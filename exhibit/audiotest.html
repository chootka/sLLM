<!doctype html><meta charset=utf-8><title>audio isolation test</title>
<style>
 body{background:#000;color:#ccc;font:16px system-ui;margin:0;
      display:flex;flex-direction:column;gap:10px;padding:18px}
 button{font:600 18px system-ui;padding:22px;background:#111;color:#eee;
        border:1px solid #444;border-radius:0;text-align:left}
 button:active{background:#eee;color:#000}
 #log{font:13px ui-monospace,monospace;color:#8a8;white-space:pre-wrap;padding-top:6px}
 small{color:#777;font-weight:400}
</style>
<button id=b1>1 — native OscillatorNode<br><small>no JS in the audio path at all</small></button>
<button id=b2>2 — worklet, pure zeros, no messages<br><small>silence. tests worklet scheduling alone</small></button>
<button id=b3>3 — worklet, pure zeros + 50ms messages<br><small>silence + identical IPC traffic to the piece</small></button>
<button id=b4>4 — worklet, heavy math + 50ms messages<br><small>closest to the piece. audible tone</small></button>
<button id=x>STOP</button>
<div id=log>tap one, listen and watch the ALSA poll for 60s.</div>
<script>
let ctx, node, osc, timer
const log = m => document.getElementById('log').textContent = m
function stop(){
  if(timer){clearInterval(timer); timer=null}
  if(osc){try{osc.stop()}catch(e){}; osc=null}
  if(node){node.disconnect(); node=null}
  if(ctx){ctx.close(); ctx=null}
  log('stopped')
}
document.getElementById('x').onclick = stop

document.getElementById('b1').onclick = async () => {
  stop(); ctx = new AudioContext()
  osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value=110
  const g = ctx.createGain(); g.gain.value=0.15
  osc.connect(g).connect(ctx.destination); osc.start(); await ctx.resume()
  log('1  native oscillator @ '+ctx.sampleRate+' Hz')
}

const mkUrl = body => URL.createObjectURL(new Blob([`
class P extends AudioWorkletProcessor{
  constructor(){ super(); this.p=0; this.dummy=0
    this.port.onmessage = e => { if(e.data) this.dummy = e.data.v || 0 } }
  process(inputs,outputs){
    const o=outputs[0], n=o[0].length
    for(let i=0;i<n;i++){ ${body}
      o[0][i]=v; if(o[1])o[1][i]=v }
    return true
  }
}
registerProcessor('p',P)`], {type:'text/javascript'}))

async function run(body,msgs,label){
  stop(); ctx = new AudioContext()
  await ctx.audioWorklet.addModule(mkUrl(body))
  node = new AudioWorkletNode(ctx,'p',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]})
  node.connect(ctx.destination); await ctx.resume()
  if(msgs) timer = setInterval(()=>node.port.postMessage({v:Math.random()}),50)
  log(label+' @ '+ctx.sampleRate+' Hz'+(msgs?', posting every 50ms':''))
}

const SILENT = 'const v=0'
const HEAVY  = `let v=0
   for(let k=0;k<24;k++){ this.p+=110/sampleRate/24; if(this.p>=1)this.p-=1
     v+=Math.sin(this.p*6.283185)*0.006 }`

document.getElementById('b2').onclick = () => run(SILENT,false,'2  silent worklet, no messages')
document.getElementById('b3').onclick = () => run(SILENT,true, '3  silent worklet + messages')
document.getElementById('b4').onclick = () => run(HEAVY, true, '4  heavy worklet + messages')
</script>
